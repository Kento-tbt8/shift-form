<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>希望シフト提出</title>
<style>
  *{box-sizing:border-box}
  body{font-family:-apple-system,"Hiragino Sans",sans-serif;margin:0;padding:16px 12px 110px;background:#f5f5f5;color:#222}
  .wrap{max-width:460px;margin:0 auto}
  h1{font-size:18px;margin:4px 0 2px}
  .sub{font-size:13px;color:#666;margin-bottom:12px}
  .day{background:#fff;border-radius:10px;padding:10px 12px;margin-bottom:8px;border:2px solid transparent}
  .day.todo{border-color:#f3c9c9}
  .dl{font-weight:600;font-size:15px;margin-bottom:8px}
  .sat{color:#1a6fd1}.sun{color:#d33}
  .btns{display:flex;gap:6px}
  .btns button{flex:1;padding:10px 0;font-size:14px;border:1px solid #ccc;background:#fff;border-radius:8px;color:#333}
  .btns button.on.ok{background:#06c755;border-color:#06c755;color:#fff}
  .btns button.on.tm{background:#1a6fd1;border-color:#1a6fd1;color:#fff}
  .btns button.on.off{background:#888;border-color:#888;color:#fff}
  .times{display:none;margin-top:8px;align-items:center;gap:6px}
  .times.show{display:flex}
  select{flex:1;padding:9px;font-size:15px;border:1px solid #ccc;border-radius:8px;background:#fff}
  .bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #ddd;padding:10px 12px 22px}
  .bar .in{max-width:460px;margin:0 auto}
  #submit{width:100%;padding:14px;font-size:16px;color:#fff;background:#06c755;border:0;border-radius:8px}
  #submit:disabled{opacity:.5}
  #msg{font-size:13px;margin-bottom:6px;min-height:18px}
  .err{color:#d33}.okc{color:#06a047}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title">希望シフト提出</h1>
  <div class="sub" id="sub">読み込み中...</div>
  <div id="list"></div>
</div>
<div class="bar"><div class="in">
  <div id="msg"></div>
  <button id="submit" disabled>この内容で提出する</button>
</div></div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
const LIFF_ID = '2012618469-ggjBWbb4';
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxLzzmTsjl9lKx1fIfQQXNi7hy6MBZUt5j7S4JD1_3_Hx0803A7lFAHjqpmX-UibiGcmw/exec';
const $ = id => document.getElementById(id);
const WD = ['日','月','火','水','木','金','土'];

// 時間の選択肢（10:00〜19:00・30分刻み）
const TIMES = [];
for (let m = 10 * 60; m <= 19 * 60; m += 30) {
  TIMES.push(String(Math.floor(m / 60)).padStart(2, '0') + ':' + (m % 60 ? '30' : '00'));
}

// 対象月: URLの ?month=2026-12 を優先、なければ「来月」
function targetMonth() {
  const q = new URLSearchParams(location.search).get('month');
  if (q && /^\d{4}-(0[1-9]|1[0-2])$/.test(q)) return q;
  const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() + 1);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}
const MONTH = targetMonth();
const [Y, M] = MONTH.split('-').map(Number);
const DAYS = new Date(Y, M, 0).getDate();
const state = {}; // day -> {type,start,end}

function setMsg(t, cls){ $('msg').textContent = t || ''; $('msg').className = cls || ''; }

function render() {
  const list = $('list'); list.innerHTML = '';
  for (let d = 1; d <= DAYS; d++) {
    const wd = new Date(Y, M - 1, d).getDay();
    const box = document.createElement('div'); box.className = 'day todo'; box.id = 'd' + d;
    box.innerHTML =
      '<div class="dl ' + (wd === 6 ? 'sat' : wd === 0 ? 'sun' : '') + '">' + M + '/' + d + '（' + WD[wd] + '）</div>' +
      '<div class="btns">' +
        '<button type="button" data-t="出れる" class="ok">出れる</button>' +
        '<button type="button" data-t="時間指定" class="tm">時間指定</button>' +
        '<button type="button" data-t="休み" class="off">休み</button>' +
      '</div>' +
      '<div class="times"><select class="st"></select><span>〜</span><select class="en"></select></div>';
    const st = box.querySelector('.st'), en = box.querySelector('.en');
    TIMES.slice(0, -1).forEach(t => st.add(new Option(t, t)));
    TIMES.slice(1).forEach(t => en.add(new Option(t, t)));
    st.value = '10:00'; en.value = '19:00';
    box.querySelectorAll('.btns button').forEach(b => b.addEventListener('click', () => {
      state[d] = state[d] || {};
      state[d].type = b.dataset.t;
      state[d].start = st.value; state[d].end = en.value;
      paint(d);
    }));
    st.addEventListener('change', () => { if (state[d]) state[d].start = st.value; });
    en.addEventListener('change', () => { if (state[d]) state[d].end = en.value; });
    list.appendChild(box);
  }
}

function paint(d) {
  const box = $('d' + d), s = state[d];
  box.querySelectorAll('.btns button').forEach(b => b.classList.toggle('on', b.dataset.t === s.type));
  box.querySelector('.times').classList.toggle('show', s.type === '時間指定');
  box.classList.toggle('todo', !s.type);
}

// 提出済みの回答があれば、フォームに入れた状態にする
function applyAnswers(answers) {
  if (!Array.isArray(answers) || answers.length !== DAYS) return false;
  answers.forEach((a, i) => {
    if (!a || !a.type) return;
    const d = i + 1, box = $('d' + d);
    state[d] = { type: a.type, start: a.start || '10:00', end: a.end || '19:00' };
    if (a.type === '時間指定') {
      box.querySelector('.st').value = state[d].start;
      box.querySelector('.en').value = state[d].end;
    }
    paint(d);
  });
  return true;
}

function pad(n){ return String(n).padStart(2, '0'); }

async function call(payload) {
  const res = await fetch(GAS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // プリフライト回避
    body: JSON.stringify(Object.assign({ idToken: liff.getIDToken() }, payload))
  });
  return res.json();
}

(async () => {
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login(); return; }
    const r = await call({ action: 'whoami', month: MONTH });
    if (!r.ok) throw new Error(r.error);
    $('title').textContent = M + '月の希望シフト';
    render();
    const done = applyAnswers(r.answers);
    $('sub').textContent = r.name + ' さん / ' + Y + '年' + M + '月分' +
      (done ? '（提出済み。内容を直して再提出できます）' : '（全ての日を選んでください）');
    $('submit').disabled = false;
  } catch (e) {
    $('sub').textContent = '';
    setMsg('エラー: ' + e.message, 'err');
  }
})();

$('submit').addEventListener('click', async () => {
  const entries = [];
  for (let d = 1; d <= DAYS; d++) {
    const s = state[d];
    if (!s || !s.type) {
      $('d' + d).scrollIntoView({ behavior: 'smooth', block: 'center' });
      setMsg(M + '/' + d + ' が未選択です。全ての日を選んでください', 'err'); return;
    }
    if (s.type === '時間指定' && s.start >= s.end) {
      $('d' + d).scrollIntoView({ behavior: 'smooth', block: 'center' });
      setMsg(M + '/' + d + ' の終了時間は開始より後にしてください', 'err'); return;
    }
    entries.push({ date: Y + '-' + pad(M) + '-' + pad(d), type: s.type,
                   start: s.type === '時間指定' ? s.start : '', end: s.type === '時間指定' ? s.end : '' });
  }
  $('submit').disabled = true; setMsg('送信中...');
  try {
    const r = await call({ action: 'shift', month: MONTH, entries });
    if (!r.ok) throw new Error(r.error);
    setMsg('提出しました。ありがとうございます！', 'okc');
    setTimeout(() => liff.closeWindow(), 1500);
  } catch (e) {
    setMsg('エラー: ' + e.message, 'err'); $('submit').disabled = false;
  }
});
</script>
</body>
</html>
